<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angielski</title>
<style>
/* ---------- Page ---------- */
body {
  max-width: 640px;
  margin: 40px auto;
  padding: 0 16px;
  text-align: center;
  font-family: "Segoe UI", Arial, sans-serif;
  background: #ffe3ef;
  color: #5a2a3c;
}

h1 {
  color: #e6317f;
  font-size: 2.4rem;
  margin-bottom: 8px;
}

p {
  font-size: 1.1rem;
  margin: 0 0 28px;
}

/* ---------- Tiles ---------- */
.tiles {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}

.tile {
  aspect-ratio: 1 / 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px;
  background: #fff;
  border-radius: 28px;
  box-shadow: 0 8px 24px rgba(230, 49, 127, 0.18), 0 6px 0 #ffb3d1;
  color: #5a2a3c;
  text-decoration: none;
  transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
}

.tile:hover {
  background: #fff7fb;
  transform: translateY(-3px);
  box-shadow: 0 12px 28px rgba(230, 49, 127, 0.25), 0 9px 0 #ff8fc0;
}

.tile:active {
  transform: translateY(4px);
  box-shadow: 0 4px 12px rgba(230, 49, 127, 0.18), 0 2px 0 #ffb3d1;
}

.tile:focus-visible {
  outline: 4px solid #ff4f9a;
  outline-offset: 4px;
}

.tile .sample {
  font-size: 1.15rem;
  color: #9c6b80;
}

.tile .ipa {
  font-family: "Noto Serif", "Gentium Plus", "Charis SIL", "DejaVu Serif", "Times New Roman", serif;
}

.tile .name {
  font-size: 1.7rem;
  font-weight: bold;
  color: #c2185b;
}

.tile .go {
  margin-top: 4px;
  padding: 6px 22px;
  border-radius: 999px;
  background: #ff4f9a;
  color: #fff;
  font-weight: bold;
  font-size: 1rem;
}

@media (max-width: 420px) {
  .tiles { grid-template-columns: 1fr; }
  .tile { aspect-ratio: auto; min-height: 200px; }
}
</style>
</head>
<body>
<div class="tiles">
  <!-- Zmień href, jeśli pliki nazywają się inaczej -->
  <a class="tile" href="irregularverbs.html">
    <span class="name">Irregular verbs</span>
    <span class="go">Start</span>
  </a>
  <a class="tile" href="fonetyka.html">
    <span class="name">Fonetyka</span>
    <span class="go">Start</span>
  </a>
</div>
</body>
</html>
